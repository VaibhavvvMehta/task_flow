{% extends 'layouts/app.html' %}
{% load static %}

{% block page_title %}Add to Team{% endblock %}
{% block page_subtitle %}Add a new user to your team{% endblock %}

{% block app_content %}
<div style="max-width:560px;">

  <div class="card" style="border-radius:14px;padding:28px;">

    <!-- Manager info banner — pre-filled, read-only -->
    <div id="manager-banner" style="
      display:flex;align-items:center;gap:12px;
      padding:12px 16px;border-radius:10px;
      background:var(--blue-light);border:1px solid var(--blue);
      margin-bottom:24px;
    ">
      <div id="mgr-avatar" style="
        width:36px;height:36px;flex-shrink:0;border-radius:50%;
        background:var(--blue);display:flex;align-items:center;justify-content:center;
        font-size:12px;font-weight:700;color:white;
      ">--</div>
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--text);" id="mgr-name">Loading...</div>
        <div style="font-size:11px;color:var(--text-3);">Adding to your team · <span id="mgr-dept"></span></div>
      </div>
      <span id="mgr-role-badge" style="
        margin-left:auto;flex-shrink:0;
        font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;
        background:var(--blue);color:white;text-transform:uppercase;
      "></span>
    </div>

    <!-- Form fields -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;">
      <div>
        <label class="label" for="inp-first">First Name <span style="color:#ef4444;">*</span></label>
        <input id="inp-first" type="text" class="input-field" placeholder="First name" autocomplete="given-name">
      </div>
      <div>
        <label class="label" for="inp-last">Last Name <span style="color:#ef4444;">*</span></label>
        <input id="inp-last" type="text" class="input-field" placeholder="Last name" autocomplete="family-name">
      </div>
    </div>

    <div style="margin-bottom:14px;">
      <label class="label" for="inp-email">Email Address <span style="color:#ef4444;">*</span></label>
      <input id="inp-email" type="email" class="input-field" placeholder="employee@company.com" autocomplete="email">
    </div>

    <div style="margin-bottom:14px;">
      <label class="label" for="inp-username">Username <span style="color:#ef4444;">*</span></label>
      <input id="inp-username" type="text" class="input-field" placeholder="e.g. john.doe" autocomplete="off">
    </div>

    <div style="margin-bottom:14px;">
      <label class="label" for="inp-dept">Department</label>
      <select id="inp-dept" class="input-field">
  <option value="">— Select Department —</option>
  <option value="Software">Software</option>
  <option value="Finance">Finance</option>
  <option value="Marketing">Marketing</option>
  <option value="Operations">Operations</option>
  <option value="Executive">Executive</option>
</select>
    </div>



    <!-- Submit -->
    <div style="display:flex;align-items:center;gap:14px;">
      <button onclick="addToTeam()" id="submit-btn" class="btn-primary" style="width:auto;padding:9px 28px;">
        Add to Team
      </button>
      <span id="form-msg" style="font-size:13px;display:none;"></span>
    </div>

  </div>

</div>
{% endblock %}

{% block page_js %}
<script>
let currentUser = null;

async function init() { 
    
  try {
    let res = await fetch('/api/v1/auth/me/', { credentials: 'include' });
    if (res.status === 401) {
      const r = await fetch('/api/v1/auth/token/refresh/', { method: 'POST', credentials: 'include' });
      if (!r.ok) { window.location.href = '/'; return; }
      res = await fetch('/api/v1/auth/me/', { credentials: 'include' });
    }
    if (!res.ok) { window.location.href = '/'; return; }
    currentUser = await res.json();

    const ELEVATED = ['manager', 'ceo', 'cfo', 'cto'];
    if (!ELEVATED.includes(currentUser.role)) {
      window.location.href = '/dashboard/';
      return;
    }

    // Pre-fill manager banner
    const parts    = (currentUser.full_name || '').trim().split(/\s+/).filter(Boolean);
    const initials = parts.map(p => p[0]).join('').slice(0, 2).toUpperCase() || '?';
    document.getElementById('mgr-avatar').textContent     = initials;
    document.getElementById('mgr-name').textContent       = currentUser.full_name;
    document.getElementById('mgr-dept').textContent       = currentUser.department || 'No department';
    document.getElementById('mgr-role-badge').textContent = currentUser.role.toUpperCase();

    // Pre-fill dept field with manager's own dept as hint
    if (currentUser.department) {
      document.getElementById('inp-dept').placeholder = `Default: ${currentUser.department}`;
    }
  } catch(e) {
    console.error('Init error:', e);
  }
}

async function addToTeam() {
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('form-msg');

  const first    = document.getElementById('inp-first').value.trim();
  const last     = document.getElementById('inp-last').value.trim();
  const email    = document.getElementById('inp-email').value.trim();
  const username = document.getElementById('inp-username').value.trim();
  const dept     = document.getElementById('inp-dept').value.trim();

  if (!first || !last || !email || !username) {
    showMsg('All required fields must be filled in.', '#ef4444');
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Adding…';
  msg.style.display = 'none';

  try {
    const res = await fetch('/api/v1/users/team/add/', {
      method:      'POST',
      credentials: 'include',
      headers:     { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        first_name: first,
        last_name:  last,
        email,
        username,
        department: dept,
      }),
    });

    const data = await res.json();

    if (res.ok) {
      showMsg(`✓ ${data.user.full_name} added to the team!`, '#16a34a');
      // Clear the form but keep manager banner
      ['inp-first','inp-last','inp-email','inp-username','inp-dept'].forEach(id => {
        document.getElementById(id).value = '';
      });
    } else {
      showMsg(data.error || 'Failed to add user.', '#ef4444');
    }
  } catch(e) {
    showMsg('Connection error. Please try again.', '#ef4444');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Add to Team';
  }
}

function showMsg(text, color) {
  const msg = document.getElementById('form-msg');
  msg.textContent   = text;
  msg.style.color   = color;
  msg.style.display = 'inline';
  setTimeout(() => { msg.style.display = 'none'; }, 4000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
{% endblock %}
