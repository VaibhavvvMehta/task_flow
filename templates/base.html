<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TaskFlow{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #f1f5f9;
      --surface:   #ffffff;
      --border:    #e2e8f0;
      --text:      #0f172a;
      --text-2:    #475569;
      --text-3:    #94a3b8;
      --blue:      #2563eb;
      --blue-dark: #1d4ed8;
      --blue-light:#eff6ff;
      --error:     #dc2626;
      --error-bg:  #fef2f2;
      --error-border: #fecaca; 
      /* Layout */
    --sidebar-w: 240px;
    --sidebar-collapsed-w: 64px;
    --topbar-h: 56px;
    --sidebar-bg: var(--surface);
    --sidebar-border: var(--border);
    }
    html.dark {
      --bg:        #0f172a;
      --surface:   #1e293b;
      --border:    #334155;
      --text:      #f1f5f9;
      --text-2:    #94a3b8;
      --text-3:    #475569;
      --blue:      #3b82f6;
      --blue-dark: #2563eb;
      --blue-light:#1e3a5f;
      --error:     #f87171;
      --error-bg:  #1e0a0a;
      --error-border: #7f1d1d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .text-muted  { color: var(--text-2); }
    .text-faint  { color: var(--text-3); }
    .input-field {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-field::placeholder { color: var(--text-3); }
    .input-field:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }
    .btn-primary {
      width: 100%;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: #fff;
      background: var(--blue);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-primary:hover   { background: var(--blue-dark); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }
    /* Dot pattern background */
    .dot-bg {
      background-image: radial-gradient(var(--border) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Sidebar nav items */
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  text-decoration: none;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  transition: background 0.15s, color 0.15s;
  position: relative;
}
.nav-item:hover {
  background: var(--bg);
  color: var(--text);
}
.nav-item.active {
  background: var(--blue-light);
  color: var(--blue);
}
.sidebar-badge {
  margin-left: auto;
  background: #ef4444;
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 20px;
  flex-shrink: 0;
}

/* Collapsed sidebar hides labels */
.sidebar-collapsed .sidebar-label { display: none; }
.sidebar-collapsed .sidebar-badge { display: none; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Dark mode toggle — fixed top right on every page -->
  <button
    id="theme-toggle"
    onclick="toggleTheme()"
    title="Toggle dark mode"
    style="
      position: fixed; top: 16px; right: 20px; z-index: 999;
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    "
  >
    <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  {% block content %}{% endblock %}

  <!-- Dark mode script — runs before paint to avoid flash -->
  <script>
    (function() {
      const saved = localStorage.getItem('tf-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? saved === 'dark' : prefersDark;
      if (isDark) {
        document.documentElement.classList.replace('light', 'dark');
        document.getElementById('icon-sun').style.display = 'block';
        document.getElementById('icon-moon').style.display = 'none';
      }
    })();

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      if (isDark) {
        html.classList.replace('dark', 'light');
        localStorage.setItem('tf-theme', 'light');
        document.getElementById('icon-sun').style.display = 'none';
        document.getElementById('icon-moon').style.display = 'block';
      } else {
        html.classList.replace('light', 'dark');
        localStorage.setItem('tf-theme', 'dark');
        document.getElementById('icon-sun').style.display = 'block';
        document.getElementById('icon-moon').style.display = 'none';
      }
    }
  </script>

  {% if debug %}
  <script src="{% url 'django_browser_reload:eventsource' %}"></script>
  {% endif %}
  {% block extra_js %}{% endblock %}
</body>
</html>
